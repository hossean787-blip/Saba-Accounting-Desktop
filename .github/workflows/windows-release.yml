name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'main.py'
      - 'saba_accounting/**'
      - 'tests/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Dependency and static security checks
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1" "bandit==1.9.4"
          python -m pip_audit -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed" }
          bandit -q -r saba_accounting main.py -x tests --confidence-level medium
          if ($LASTEXITCODE -ne 0) { throw "Static security scan failed" }
      - name: Python syntax check
        run: python -m compileall -q main.py saba_accounting tests
      - name: Automated tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unittest-windows.log
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.12,<7"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SabaAccounting --add-data "saba_accounting/schema.sql;saba_accounting" --add-data "saba_accounting/erp_schema.sql;saba_accounting" --add-data "saba_accounting/finance_schema.sql;saba_accounting" main.py
          if ($LASTEXITCODE -ne 0) { throw "EXE build failed" }
      - name: Inspect executable and write checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/SabaAccounting.exe"
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "EXE unexpectedly small" }
          $file = [System.IO.File]::OpenRead($exe)
          try {
            $header = New-Object byte[] 2
            [void]$file.Read($header, 0, 2)
            if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw "Not a Windows PE executable" }
          } finally { $file.Dispose() }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SabaAccounting.exe" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
          Write-Host "EXE SHA256: $hash"
          Write-Host "EXE bytes: $($item.Length)"
      - name: Smoke test command line startup
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "dist/SabaAccounting.exe") -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "EXE --help returned exit code $($p.ExitCode)" }
      - name: Build and smoke-test per-user installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\SabaAccounting.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $install = Join-Path $env:RUNNER_TEMP "SabaInstalled"
          $log = Join-Path $env:RUNNER_TEMP "saba-install.log"
          $p = Start-Process "dist\SabaAccounting-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install", "/LOG=$log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          if (-not (Test-Path "$install\SabaAccounting.exe")) { throw "Installed EXE missing" }
          $p = Start-Process "$install\SabaAccounting.exe" -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installed EXE smoke failed" }
          $uninstaller = Get-ChildItem $install -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller missing" }
          $p = Start-Process $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed" }
      - name: Package source and output checksums
        shell: pwsh
        run: |
          git archive --format=zip --output=dist/SabaAccounting-Source.zip HEAD
          Get-ChildItem dist -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
      - name: Upload Windows EXE, installer, source and checksums
        uses: actions/upload-artifact@v4
        with:
          name: SabaAccounting-Windows
          path: |
            dist/SabaAccounting.exe
            dist/SabaAccounting-Setup.exe
            dist/SabaAccounting-Source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-log
          path: unittest-windows.log
          if-no-files-found: ignore
          retention-days: 90
