name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'main.py'
      - 'saba_accounting/**'
      - 'tests/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m compileall -q main.py saba_accounting tests
      - name: Automated tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unittest-windows.log
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.12,<7"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SabaAccounting --add-data "saba_accounting/schema.sql;saba_accounting" --add-data "saba_accounting/erp_schema.sql;saba_accounting" --add-data "saba_accounting/finance_schema.sql;saba_accounting" main.py
          if ($LASTEXITCODE -ne 0) { throw "EXE build failed" }
      - name: Inspect executable and write checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/SabaAccounting.exe"
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "EXE unexpectedly small" }
          $file = [System.IO.File]::OpenRead($exe)
          try {
            $header = New-Object byte[] 2
            [void]$file.Read($header, 0, 2)
            if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw "Not a Windows PE executable" }
          } finally { $file.Dispose() }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SabaAccounting.exe" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
          Write-Host "EXE SHA256: $hash"
          Write-Host "EXE bytes: $($item.Length)"
      - name: Smoke test command line startup
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "dist/SabaAccounting.exe") -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "EXE --help returned exit code $($p.ExitCode)" }
      - name: Upload Windows EXE and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SabaAccounting-Windows
          path: |
            dist/SabaAccounting.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-log
          path: unittest-windows.log
          if-no-files-found: ignore
          retention-days: 90
