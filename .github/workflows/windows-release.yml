name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'main.py'
      - 'saba_accounting/**'
      - 'tests/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Automated tests
        run: python -m unittest discover -s tests -v
      - name: PyInstaller
        run: |
          python -m pip install "pyinstaller>=6.12,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SabaAccounting --add-data "saba_accounting/schema.sql;saba_accounting" --add-data "saba_accounting/erp_schema.sql;saba_accounting" --add-data "saba_accounting/finance_schema.sql;saba_accounting" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SabaAccounting-Windows
          path: dist/SabaAccounting.exe
          if-no-files-found: error
